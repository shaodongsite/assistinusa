    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--bd:#7A3B1E;--bd2:#5C2B12;--bm:#D85A30;--am:#EF9F27;--al:#FAEEDA;--cr:#FDF3E7;--cl:#FFFBF7;--td:#412402;--tm:#633806;--tu:#854F0B;--br:#F5C4B3}

    .nav-logo svg{width:38px;height:38px}
    .nav-logo-zh{color:var(--al);font-size:14px;font-weight:600;display:block}
    .nav-logo-en{color:rgba(250,238,218,.55);font-size:10px;display:block}
    .nav-links{display:flex;align-items:center;flex:1}
    .nav-links a{color:rgba(250,238,218,.8);font-size:13px;padding:0 12px;height:58px;display:flex;align-items:center;text-decoration:none;white-space:nowrap;border-bottom:2px solid transparent}
    .nav-links a:hover,.nav-links a.active{color:var(--al)}
    .nav-links a.active{border-bottom-color:var(--am)}
    .nav-dropdown{position:relative}
    .nav-dropdown>a::after{content:' ▾';font-size:10px;opacity:.7}
    .dd{display:none;position:absolute;top:100%;left:0;background:#fff;border:.5px solid var(--br);border-radius:10px;min-width:200px;padding:6px 0;box-shadow:0 4px 16px rgba(0,0,0,.08);z-index:200}
    .nav-dropdown:hover .dd{display:block}
    .dd a{display:block;padding:9px 18px;font-size:13px;color:var(--td) !important;text-decoration:none;height:auto;border:none !important;white-space:nowrap;background:transparent}
    .dd a:hover{background:var(--cr);color:var(--bd) !important}
    .dd a:hover{background:var(--cr)}
    .nav-lang{margin-left:auto;background:rgba(255,255,255,.12);color:var(--al);font-size:12px;padding:5px 12px;border-radius:20px;text-decoration:none}
    .nav-toggle{display:none;background:none;border:none;color:var(--al);font-size:22px;cursor:pointer;margin-left:auto;padding:4px}
    .coming{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60vh;padding:48px 32px;text-align:center}
    .coming-icon{font-size:64px;margin-bottom:24px}
    .coming h1{font-size:26px;font-weight:700;color:var(--td);margin-bottom:12px}
    .coming p{font-size:15px;color:var(--tu);max-width:420px;line-height:1.8}
    .coming-btn{display:inline-block;margin-top:24px;background:var(--bd);color:var(--al);padding:11px 24px;border-radius:8px;text-decoration:none;font-size:14px;font-weight:600}
    footer{background:var(--bd2);padding:18px 32px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
    .fc{font-size:12px;color:rgba(250,238,218,.45)}
    .fl{display:flex;gap:18px}
    .fl a{font-size:12px;color:rgba(250,238,218,.45);text-decoration:none}
    .fl a:hover{color:var(--al)}
    @media(max-width:700px){
      .nav-links{display:none;flex-direction:column;position:absolute;top:58px;left:0;right:0;background:var(--bd);padding:8px 0 16px}
      .nav-links.open{display:flex}
      .nav-links a{height:44px;padding:0 24px;border-bottom:none}
      .dd{position:static;box-shadow:none;border:none;background:rgba(255,255,255,.08);border-radius:0}
      .dd a{color:rgba(250,238,218,.8)}
      .nav-toggle{display:block}
      .nav-lang{display:none}
      .nav{position:relative}
    }
  </style>
